services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: countersign
      POSTGRES_PASSWORD: countersign
      POSTGRES_DB: countersign
    ports:
      - "5432:5432"
    volumes:
      - countersign-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U countersign"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://countersign:countersign@db:5432/countersign
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  countersign-db-data:
