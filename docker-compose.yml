services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: countersign
      POSTGRES_PASSWORD: countersign
      POSTGRES_DB: countersign
    ports:
      - "5432:5432"
    volumes:
      - countersign-db-data:/var/lib/postgresql/data

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://countersign:countersign@db:5432/countersign
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  countersign-db-data:
